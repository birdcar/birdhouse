name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: birdcar/actions/create-release@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          timezone: 'America/Chicago'

  build:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build all platforms
        run: bun run build:all

      - name: Upload binaries to release
        run: gh release upload "$GITHUB_REF_NAME" dist/bh-linux-x64 dist/bh-linux-arm64 dist/bh-darwin-x64 dist/bh-darwin-arm64 dist/bh-win32-x64.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

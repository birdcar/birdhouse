name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write

    outputs:
      tag: ${{ steps.auto-release.outputs.tag }}
      skipped: ${{ steps.auto-release.outputs.skipped }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Release
        id: auto-release
        uses: birdcar/actions/auto-release@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          timezone: 'America/Chicago'

  build:
    needs: release
    if: needs.release.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build all platforms
        run: bun run build:all

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/bh-linux-x64 dist/bh-linux-arm64 dist/bh-darwin-x64 dist/bh-darwin-arm64 dist/bh-win32-x64.exe

  publish:
    needs: [release, build]
    if: needs.release.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish to NPM
        run: bunx npm publish --provenance --access public

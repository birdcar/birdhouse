name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write

    outputs:
      tag: ${{ steps.auto-release.outputs.tag }}
      skipped: ${{ steps.auto-release.outputs.skipped }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Release
        id: auto-release
        uses: birdcar/actions/auto-release@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          timezone: 'America/Chicago'

      - name: Update package.json version
        if: steps.auto-release.outputs.skipped != 'true'
        env:
          TAG: ${{ steps.auto-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Commit and update tag
        if: steps.auto-release.outputs.skipped != 'true'
        env:
          TAG: ${{ steps.auto-release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit --amend --no-edit
          git tag -f "$TAG"
          git push --force origin "$TAG"
          git push origin main

  build:
    needs: release
    if: needs.release.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build all platforms
        run: bun run build:all

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/bh-linux-x64 dist/bh-linux-arm64 dist/bh-darwin-x64 dist/bh-darwin-arm64 dist/bh-win32-x64.exe

  publish:
    needs: [release, build]
    if: needs.release.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish to NPM
        run: bunx npm publish --provenance --access public
